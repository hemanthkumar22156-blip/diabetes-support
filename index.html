  "chest pain",
  "cannot breathe",
  "difficulty breathing",
  "unconscious",

];


function normalize(text) {

  return text
    .toLowerCase()
    .replace(/[.,!?;:()[\]{}"'`]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


function containsAny(text, words) {

  return words.some(word => text.includes(word));

}


function useQuestion(question) {

  document.getElementById("question").value = question;

  getAnswer();

}


function clearQuestion() {

  document.getElementById("question").value = "";

  document.getElementById("results").innerHTML = `
    <div class="empty">
      Customer question type பண்ணி <b>Get Answer</b> click பண்ணுங்க.
    </div>
  `;

}


function getAnswer() {

  const rawQuestion =
    document.getElementById("question").value.trim();

  const results =
    document.getElementById("results");


  if (!rawQuestion) {

    results.innerHTML = `
      <div class="warning">
        Please enter a customer question first.
      </div>
    `;

    return;
  }


  const question =
    normalize(rawQuestion);


  /*
    EMERGENCY CHECK
  */

  if (containsAny(question, emergencyKeywords)) {

    results.innerHTML = `
      <div class="danger">

        <h3>⚠️ Urgent Medical Attention</h3>

        <p>
          This question may describe an urgent medical situation.
          The support team should not provide treatment instructions
          through this tool.
        </p>

        <p>
          Please advise the customer to seek immediate medical attention
          from an appropriate healthcare professional or emergency service.
        </p>

      </div>
    `;

    return;
  }


  /*
    HIGH-RISK MEDICAL CHECK
  */

  if (containsAny(question, highRiskKeywords)) {

    results.innerHTML = `
      <div class="warning">

        <h3>⚠️ Medical Review Required</h3>

        <p>
          இந்த question-க்கு medicine / treatment change பற்றிய
          direct advice இந்த tool மூலம் கொடுக்கக்கூடாது.
        </p>

        <p>
          This tool does not provide instructions to start, stop,
          reduce or change medicines.
        </p>

        <p>
          Customer-ஐ qualified healthcare professional அல்லது
          support team-க்கு refer பண்ணுங்க.
        </p>

      </div>

      ${createCallbackBox()}
    `;

    return;
  }


  /*
    FIND BEST APPROVED ANSWER
  */

  let bestMatch = null;

  let bestScore = 0;


  knowledgeBase.forEach(item => {

    let score = 0;

    item.keywords.forEach(keyword => {

      const key = normalize(keyword);

      if (question.includes(key)) {

        score += Math.max(key.split(" ").length, 1);

      }

    });


    if (score > bestScore) {

      bestScore = score;

      bestMatch = item;

    }

  });


  /*
    NO APPROVED ANSWER
  */

  if (!bestMatch || bestScore < 1) {

    results.innerHTML = `

      <div class="warning">

        <h3>Approved Answer Not Found</h3>

        <p>
          இந்த question-க்கு approved answer கிடைக்கவில்லை.
        </p>

        <p>
          இந்த tool random answer generate பண்ணாது.
        </p>

        <p>
          <b>
          Customer-ஐ webinar-ஐ continue பண்ண சொல்லி,
          further assistance-க்கு support team-ஐ contact பண்ணுங்க.
          </b>
        </p>

      </div>

      ${createCallbackBox()}

    `;

    return;
  }


  /*
    SHOW TWO ANSWER OPTIONS
  */

  results.innerHTML = `

    <div class="success">
      <b>Approved answer found.</b>
      Customer-க்கு suitable answer-ஐ select செய்து copy பண்ணலாம்.
    </div>

    <div class="answer-card">

      <h3>Option 1</h3>

      <div class="language">Tamil</div>

      <div class="answer-text" id="answer1Tamil">
${bestMatch.tamil}

${CALLBACK_TAMIL}
      </div>

      <button class="copy-btn"
        onclick="copyText('answer1Tamil')">
        Copy Answer
      </button>

    </div>


    <div class="answer-card">

      <h3>Option 2</h3>

      <div class="language">English</div>

      <div class="answer-text" id="answer1English">
${bestMatch.english}

${CALLBACK_ENGLISH}
      </div>

      <button class="copy-btn"
        onclick="copyText('answer1English')">
        Copy Answer
      </button>

    </div>

  `;

}


function createCallbackBox() {

  return `

    <div class="callback-box">

      <h3>Still any doubt?</h3>

      <p>
        ${CALLBACK_TAMIL}
      </p>

      <p>
        ${CALLBACK_ENGLISH}
      </p>

      <input
        id="mobileNumber"
        type="tel"
        maxlength="10"
        placeholder="Enter 10-digit mobile number"
      >

      <button
        class="primary"
        style="margin-top:12px;"
        onclick="submitMobile()">

        Submit Mobile Number

      </button>

      <div
        id="mobileMessage"
        class="small-note">
      </div>

      <div class="small-note">
        Note: This version only validates the number in the browser.
        It does not permanently save the number.
      </div>

    </div>

  `;

}


function submitMobile() {

  const input =
    document.getElementById("mobileNumber");

  const message =
    document.getElementById("mobileMessage");


  if (!input) return;


  const number =
    input.value.replace(/\D/g, "");


  if (!/^[6-9]\d{9}$/.test(number)) {

    message.innerHTML =
      "Please enter a valid 10-digit Indian mobile number.";

    return;

  }


  message.innerHTML =
    "Mobile number received. Our support team can follow up with the customer.";

}


async function copyText(elementId) {

  const element =
    document.getElementById(elementId);

  if (!element) return;


  const text =
    element.innerText;


  try {

    await navigator.clipboard.writeText(text);

    alert("Answer copied successfully!");

  } catch (error) {

    alert("Copy failed. Please select and copy the answer manually.");

  }

}


/*
  ENTER KEY SUPPORT
*/

document
  .getElementById("question")
  .addEventListener("keydown", function(event) {

    if (event.ctrlKey && event.key === "Enter") {

      getAnswer();

    }

  });
